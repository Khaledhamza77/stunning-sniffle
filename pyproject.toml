[project]
name = "traffic-flow-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "shapely>=2.1.2",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.120",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "scipy>=1.17.1",
    "lap>=0.5.13",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = []

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
